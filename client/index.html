<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>The Rabbit Hole — Ask Questions &amp; Explore Ideas as a Knowledge Graph</title>
    <meta name="description" content="Ask a question or name a topic — The Rabbit Hole uses AI to build an interactive knowledge graph of ideas around your curiosity. Click any node and go deeper." />
    <meta name="keywords" content="knowledge graph, AI learning, interactive learning, explore topics, deep learning tool, curiosity, education" />
    <meta name="author" content="The Rabbit Hole" />
    <link rel="canonical" href="https://rabbitholeorg.org/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rabbitholeorg.org/" />
    <meta property="og:title" content="The Rabbit Hole — Ask Questions &amp; Explore Ideas" />
    <meta property="og:description" content="Ask a question or name a topic. AI maps the ideas around it into an interactive graph you can explore — one click at a time." />
    <meta property="og:image" content="https://rabbitholeorg.org/og-image.png" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="The Rabbit Hole" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://rabbitholeorg.org/" />
    <meta name="twitter:title" content="The Rabbit Hole — Ask Questions &amp; Explore Ideas" />
    <meta name="twitter:description" content="Ask a question or name a topic. AI turns your curiosity into an interactive knowledge graph." />
    <meta name="twitter:image" content="https://rabbitholeorg.org/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme colour (browser chrome on mobile) -->
    <meta name="theme-color" content="#07070f" />

    <!-- Cloudflare Turnstile loads from challenges.cloudflare.com (see client/src/lib/turnstile.js). -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
